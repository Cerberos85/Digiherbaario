<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digiherbaario</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <header>
    <h1>🌿 Digiherbaario</h1>
    <p>Ammatillinen kasvikokoelma</p>
  </header>

  <main>
    <!-- 1. Koulun ja tehtävän valinta -->
    <section id="koulu-section">
      <h2>1. Valitse tehtävä</h2>
      <div class="input-group">
        <label for="koulu-valinta">Koulu / Kurssi:</label>
        <select id="koulu-valinta">
          <option value="">-- Valitse listalta --</option>
          <option value="hatanpaa_7lk">Hatanpään koulu - 7. luokan biologia</option>
          <option value="tampere_ammatti">Tampereen Ammattiopisto - Puutarhuri 1</option>
        </select>
      </div>
      
      <!-- Edistymisnäkymä -->
      <div id="edistymis-nakyma" style="display: none;">
        <h3>Kerätty: <span id="keratty-lkm">0</span> / <span id="yhteensa-lkm">0</span></h3>
        <div id="kasvi-tagit" class="tag-container"></div>
      </div>
    </section>

    <!-- 2. Kasvin lisäyslomake -->
    <section id="lomake-section">
      <h2>2. Lisää uusi kasvihavainto</h2>
      <form id="kasvi-lomake">
        
        <div class="input-group">
          <label for="laji">Kasvilaji (Suomeksi):</label>
          <input type="text" id="laji" list="kasvi-ehdotukset" required placeholder="Esim. Valkovuokko">
          <datalist id="kasvi-ehdotukset"></datalist>
        </div>
        
        <div class="input-group">
          <label for="tieteellinen">Tieteellinen nimi (Vapaaehtoinen):</label>
          <input type="text" id="tieteellinen" placeholder="Esim. Anemone nemorosa">
        </div>

        <div class="input-group">
          <label for="oppilas">Kerääjä (Oma nimesi):</label>
          <input type="text" id="oppilas" required placeholder="Esim. Matti Meikäläinen">
        </div>

        <div class="input-group">
          <label for="pvm">Päivämäärä:</label>
          <input type="date" id="pvm" required>
        </div>

        <div class="input-group">
          <label>Tarkka sijainti (GPS):</label>
          <button type="button" id="btn-gps" class="btn-gps">📍 Hae nykyinen sijainti</button>
          <p id="gps-tulos" class="gps-tulos-teksti">Sijaintia ei haettu.</p>
          <input type="hidden" id="lat">
          <input type="hidden" id="lng">
        </div>

        <!-- 3. Kuvavalikko kustomoiduilla painikkeilla -->
        <h3 style="margin: 20px 0 10px 0; border-bottom: 1px solid #ccc; padding-bottom: 5px;">Kuvavalikko (3 kpl)</h3>
        <p style="font-size: 0.85rem; color: #666; margin-bottom: 15px;">Klikkaa valikosta, minkä kuvan haluat ottaa. Selain käsittelee kuvan automaattisesti.</p>

        <div class="kamera-valikko">
          <!-- Yleiskuva -->
          <div>
            <button type="button" class="btn-kamera" id="btn-kamera-yleis">
              <span>📷 1. Ota Yleiskuva (Elinympäristö)</span>
            </button>
            <input type="file" id="kuva-yleis" accept="image/*" capture="environment" style="display: none;" required>
            <div id="status-yleis" class="kuva-status"></div>
          </div>

          <!-- Runkokuva -->
          <div>
            <button type="button" class="btn-kamera" id="btn-kamera-runko">
              <span>📷 2. Ota kuva rungosta/varresta</span>
            </button>
            <input type="file" id="kuva-runko" accept="image/*" capture="environment" style="display: none;" required>
            <div id="status-runko" class="kuva-status"></div>
          </div>

          <!-- Lehti/kukkakuva -->
          <div>
            <button type="button" class="btn-kamera" id="btn-kamera-lehti
