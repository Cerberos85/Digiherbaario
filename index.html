<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digiherbaario</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <header>
    <h1>🌿 Digiherbaario</h1>
    <p>Ammatillinen kasvikokoelma</p>
  </header>

  <main>
    <!-- Koulun ja tehtävän valinta -->
    <section id="koulu-section">
      <h2>1. Valitse tehtävä</h2>
      <div class="input-group">
        <label for="koulu-valinta">Koulu / Kurssi:</label>
        <select id="koulu-valinta">
          <option value="">-- Valitse listalta --</option>
          <option value="hatanpaa_7lk">Hatanpään koulu - 7. luokan biologia</option>
          <option value="tampere_ammatti">Tampereen Ammattiopisto - Puutarhuri 1</option>
        </select>
      </div>
      
      <!-- Edistymisnäkymä -->
      <div id="edistymis-nakyma" style="display: none;">
        <h3>Kerätty: <span id="keratty-lkm">0</span> / <span id="yhteensa-lkm">0</span></h3>
        <div id="kasvi-tagit" class="tag-container"></div>
      </div>
    </section>

    <!-- Kasvin lisäyslomake -->
    <section id="lomake-section">
      <h2>2. Lisää uusi kasvihavainto</h2>
      <form id="kasvi-lomake">
        
        <div class="input-group">
          <label for="laji">Kasvilaji (Suomeksi):</label>
          <input type="text" id="laji" list="kasvi-ehdotukset" required placeholder="Esim. Valkovuokko">
          <datalist id="kasvi-ehdotukset"></datalist>
        </div>
        
        <div class="input-group">
          <label for="tieteellinen">Tieteellinen nimi (Vapaaehtoinen):</label>
          <input type="text" id="tieteellinen" placeholder="Esim. Anemone nemorosa">
        </div>

        <div class="input-group">
          <label for="oppilas">Kerääjä (Oma nimesi):</label>
          <input type="text" id="oppilas" required placeholder="Esim. Matti Meikäläinen">
        </div>

        <div class="input-group">
          <label for="pvm">Päivämäärä:</label>
          <input type="date" id="pvm" required>
        </div>

        <div class="input-group">
          <label>Tarkka sijainti (GPS):</label>
          <button type="button" id="btn-gps" class="btn-gps">📍 Hae nykyinen sijainti</button>
          <p id="gps-tulos" class="gps-tulos-teksti">Sijaintia ei haettu.</p>
          <input type="hidden" id="lat">
          <input type="hidden" id="lng">
        </div>

        <h3 style="margin: 20px 0 10px 0; border-bottom: 1px solid #ccc; padding-bottom: 5px;">Kuvat (3 kpl)</h3>
        <p style="font-size: 0.85rem; color: #666; margin-bottom: 15px;">Ota kuvat yksitellen. Selain käsittelee kuvan heti oton jälkeen.</p>

        <!-- Kuva 1 -->
        <div class="input-group">
          <label for="kuva-yleis">1. Yleiskuva (Kasvi elinympäristössä):</label>
          <input type="file" id="kuva-yleis" accept="image/*" capture="environment" required>
          <div id="status-yleis" style="margin-top: 5px; font-weight: bold; font-size: 0.9rem; color: #2e7d32;"></div>
        </div>

        <!-- Kuva 2 -->
        <div class="input-group">
          <label for="kuva-runko">2. Kuva rungosta tai varresta:</label>
          <input type="file" id="kuva-runko" accept="image/*" capture="environment" required>
          <div id="status-runko" style="margin-top: 5px; font-weight: bold; font-size: 0.9rem; color: #2e7d32;"></div>
        </div>

        <!-- Kuva 3 -->
        <div class="input-group">
          <label for="kuva-lehti">3. Kuva lehdestä ja/tai kukasta:</label>
          <input type="file" id="kuva-lehti" accept="image/*" capture="environment" required>
          <div id="status-lehti" style="margin-top: 5px; font-weight: bold; font-size: 0.9rem; color: #2e7d32;"></div>
        </div>

        <button type="submit" class="btn-tallenna" id="btn-tallenna">Tallenna havainto</button>
      </form>
    </section>

    <!-- Havaintojen listaus ja PDF-toiminnot -->
    <section id="lista-section">
      <div class="lista-header">
        <h2>Omat havainnot</h2>
        <button id="btn-pdf" class="btn-pdf">Lataa suojattu PDF</button>
      </div>
      <div id="kasvilista">
        <p class="tyhja-viesti">Ei vielä tallennettuja kasveja.</p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
